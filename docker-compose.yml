services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leningrad
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: leningrad-backend
    ports:
      - "3080:3080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/leningrad
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

version: "2.4"

# Пароль БД: при первом запуске или после "docker-compose down -v" совпадает с DATABASE_URL в app
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: leningrad_secret
      POSTGRES_DB: leningrad
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SuperTokens Core — сервер аутентификации (ЛР7)
  # Доступен внутри Docker-сети на supertokens:3567
  # Swagger UI: http://localhost:3080/api-docs
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://postgres:leningrad_secret@db:5432/leningrad
    ports:
      - "3567:3567"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: leningrad-backend
    ports:
      - "0.0.0.0:3080:3080"
    environment:
      PORT: "3080"
      # В контейнере Dockerfile выставляет NODE_ENV=production, из-за этого TypeORM выключает synchronize.
      # Для лабораторных локально включаем автосоздание таблиц.
      TYPEORM_SYNCHRONIZE: "1"
      DATABASE_SSL_DISABLE: "1"
      DATABASE_URL: postgresql://postgres:leningrad_secret@db:5432/leningrad?sslmode=disable
      # SuperTokens (ЛР7) — подключается к локальному core-контейнеру
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_APP_NAME: "Leningrad After Victory"
      SUPERTOKENS_API_DOMAIN: http://localhost:3080
      SUPERTOKENS_WEBSITE_DOMAIN: http://localhost:3080
      # Yandex Object Storage (ЛР6) — значения берутся из .env файла на хосте
      YC_ACCESS_KEY_ID: ${YC_ACCESS_KEY_ID:-}
      YC_SECRET_ACCESS_KEY: ${YC_SECRET_ACCESS_KEY:-}
      YC_BUCKET: ${YC_BUCKET:-}
      YC_ENDPOINT: ${YC_ENDPOINT:-https://storage.yandexcloud.net}
      YC_REGION: ${YC_REGION:-ru-central1}
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#444C5E"/>
      <stop offset="100%" stop-color="#8E96A6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <rect y="530" width="1024" height="70" fill="#3C4248"/>
  <!-- разорванное кольцо блокады (нижняя часть) -->
  <path d="M 200 540 Q 200 450, 350 450 L 674 450 Q 824 450, 824 540" stroke="#5A6068" stroke-width="40" fill="none"/>
  <!-- центральный гранитный обелиск -->
  <polygon points="512,170 490,540 534,540" fill="#3D4248"/>
  <polygon points="512,170 502,540 522,540" fill="#5A6068"/>
  <!-- основание -->
  <rect x="460" y="500" width="104" height="40" fill="#3D4248"/>
  <rect x="450" y="535" width="124" height="20" fill="#2A2D32"/>
  <!-- бронзовые фигуры по бокам обелиска -->
  <g fill="#8A6840">
    <rect x="420" y="490" width="10" height="50"/>
    <rect x="406" y="500" width="10" height="40"/>
    <rect x="438" y="495" width="8" height="45"/>
    <rect x="594" y="490" width="10" height="50"/>
    <rect x="608" y="500" width="10" height="40"/>
    <rect x="580" y="495" width="8" height="45"/>
  </g>
  <!-- бронзовый венчающий знак "1941-1945" -->
  <circle cx="512" cy="160" r="22" fill="none" stroke="#D4A24A" stroke-width="6"/>
  <!-- цифра "27 января" (звезда) -->
  <polygon points="512,150 516,158 524,158 518,164 520,172 512,167 504,172 506,164 500,158 508,158" fill="#D4A24A"/>
  <!-- лучи / свет вокруг -->
  <g stroke="#D4A24A" stroke-width="2" opacity="0.4">
    <line x1="512" y1="100" x2="512" y2="120"/>
    <line x1="450" y1="160" x2="470" y2="160"/>
    <line x1="554" y1="160" x2="574" y2="160"/>
  </g>
  <!-- название -->
  <text x="512" y="60" font-family="'Geologica',sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#fff">Героическим защитникам Ленинграда</text>
  <text x="512" y="95" font-family="'Geologica',sans-serif" font-size="20" text-anchor="middle" fill="#E0E4EC">1975 · площадь Победы</text>
</svg>

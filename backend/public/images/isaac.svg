<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8FBF"/>
      <stop offset="100%" stop-color="#C9D9E5"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A24A"/>
      <stop offset="100%" stop-color="#9C7028"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <rect y="540" width="1024" height="60" fill="#7A8A6E"/>
  <!-- основной фасад -->
  <rect x="280" y="380" width="464" height="160" fill="#C8C2AF"/>
  <rect x="280" y="380" width="464" height="10" fill="#A89E84"/>
  <!-- колоннада -->
  <g fill="#E2DCC8">
    <rect x="300" y="400" width="14" height="140"/>
    <rect x="340" y="400" width="14" height="140"/>
    <rect x="380" y="400" width="14" height="140"/>
    <rect x="420" y="400" width="14" height="140"/>
    <rect x="460" y="400" width="14" height="140"/>
    <rect x="500" y="400" width="14" height="140"/>
    <rect x="540" y="400" width="14" height="140"/>
    <rect x="580" y="400" width="14" height="140"/>
    <rect x="620" y="400" width="14" height="140"/>
    <rect x="660" y="400" width="14" height="140"/>
    <rect x="700" y="400" width="14" height="140"/>
  </g>
  <!-- барабан -->
  <rect x="430" y="280" width="164" height="100" fill="#C8C2AF"/>
  <rect x="430" y="280" width="164" height="10" fill="#A89E84"/>
  <g fill="#E2DCC8">
    <rect x="445" y="295" width="10" height="80"/>
    <rect x="475" y="295" width="10" height="80"/>
    <rect x="505" y="295" width="10" height="80"/>
    <rect x="535" y="295" width="10" height="80"/>
    <rect x="565" y="295" width="10" height="80"/>
  </g>
  <!-- золотой купол -->
  <ellipse cx="512" cy="280" rx="100" ry="90" fill="url(#dome)"/>
  <path d="M 412 280 Q 412 200, 512 180 Q 612 200, 612 280 Z" fill="url(#dome)"/>
  <!-- крест -->
  <rect x="510" y="120" width="4" height="60" fill="#D4A24A"/>
  <rect x="500" y="135" width="24" height="4" fill="#D4A24A"/>
  <!-- маленький купол наверху -->
  <ellipse cx="512" cy="190" rx="20" ry="14" fill="url(#dome)"/>
  <!-- 4 малых купола -->
  <g fill="url(#dome)">
    <ellipse cx="410" cy="330" rx="22" ry="20"/>
    <ellipse cx="614" cy="330" rx="22" ry="20"/>
    <rect x="408" y="270" width="2" height="60"/>
    <rect x="612" y="270" width="2" height="60"/>
  </g>
  <!-- название -->
  <text x="512" y="65" font-family="'Geologica',sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#fff">Исаакиевский собор</text>
  <text x="512" y="100" font-family="'Geologica',sans-serif" font-size="20" text-anchor="middle" fill="#E6EEF5">1858 · Огюст Монферран</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F4D77"/>
      <stop offset="40%" stop-color="#6B89B0"/>
      <stop offset="80%" stop-color="#D9A961"/>
      <stop offset="100%" stop-color="#E8C078"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4D6B"/>
      <stop offset="100%" stop-color="#2A3450"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <!-- солнце -->
  <circle cx="1200" cy="380" r="60" fill="#F2D89A" opacity="0.7"/>
  <circle cx="1200" cy="380" r="35" fill="#F5E0AA"/>

  <!-- дальние шпили (силуэт города) -->
  <g fill="#1A2540" opacity="0.55">
    <!-- Петропавловский собор -->
    <rect x="180" y="380" width="6" height="120"/>
    <polygon points="183,200 178,380 188,380" fill="#1A2540"/>
    <circle cx="183" cy="195" r="3"/>
    <rect x="160" y="420" width="50" height="80"/>
    <!-- Адмиралтейство -->
    <rect x="380" y="400" width="160" height="100"/>
    <rect x="450" y="320" width="20" height="80"/>
    <polygon points="460,180 450,320 470,320" fill="#1A2540"/>
    <!-- Исаакий — золотой купол -->
    <rect x="640" y="400" width="120" height="100"/>
    <rect x="675" y="340" width="50" height="60"/>
    <ellipse cx="700" cy="335" rx="35" ry="30" fill="#D4A24A"/>
    <rect x="698" y="290" width="4" height="50" fill="#D4A24A"/>
    <!-- Казанский -->
    <rect x="900" y="420" width="200" height="80"/>
    <ellipse cx="1000" cy="395" rx="28" ry="22" fill="#3C5C44"/>
    <!-- Дворец -->
    <rect x="1300" y="400" width="280" height="100" fill="#3E7BB8" opacity="0.55"/>
    <rect x="1300" y="395" width="280" height="10" fill="#1A2540"/>
  </g>

  <!-- ближний берег -->
  <rect y="500" width="1600" height="200" fill="url(#water)"/>
  <!-- отражения -->
  <g fill="#F2D89A" opacity="0.45">
    <ellipse cx="1200" cy="510" rx="80" ry="3"/>
    <ellipse cx="1200" cy="540" rx="60" ry="2"/>
    <ellipse cx="1200" cy="570" rx="40" ry="2"/>
  </g>
  <g fill="#D4A24A" opacity="0.3">
    <circle cx="700" cy="520" r="3"/>
    <circle cx="700" cy="540" r="2"/>
  </g>

  <!-- набережная (передний план) -->
  <rect y="640" width="1600" height="60" fill="#2A2D38"/>
  <rect y="635" width="1600" height="8" fill="#3D404B"/>
  <!-- фонари -->
  <g fill="#1A1D28">
    <rect x="150" y="540" width="4" height="100"/>
    <circle cx="152" cy="535" r="6"/>
    <rect x="450" y="540" width="4" height="100"/>
    <circle cx="452" cy="535" r="6"/>
    <rect x="750" y="540" width="4" height="100"/>
    <circle cx="752" cy="535" r="6"/>
    <rect x="1050" y="540" width="4" height="100"/>
    <circle cx="1052" cy="535" r="6"/>
    <rect x="1350" y="540" width="4" height="100"/>
    <circle cx="1352" cy="535" r="6"/>
  </g>
  <g fill="#F0D670" opacity="0.85">
    <circle cx="152" cy="535" r="4"/>
    <circle cx="452" cy="535" r="4"/>
    <circle cx="752" cy="535" r="4"/>
    <circle cx="1052" cy="535" r="4"/>
    <circle cx="1352" cy="535" r="4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6090BD"/>
      <stop offset="100%" stop-color="#CDDDE5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <rect y="530" width="1024" height="70" fill="#7A8676"/>
  <!-- центральное здание -->
  <rect x="430" y="370" width="164" height="160" fill="#D5CFB8"/>
  <!-- барабан -->
  <rect x="460" y="290" width="104" height="80" fill="#D5CFB8"/>

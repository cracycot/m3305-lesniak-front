<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76A4D2"/>
      <stop offset="100%" stop-color="#CBDDED"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <!-- мощёная площадь -->
  <rect y="500" width="1024" height="100" fill="#A89C8A"/>
  <g stroke="#8A8070" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="520" x2="1024" y2="520"/>
    <line x1="0" y1="540" x2="1024" y2="540"/>
    <line x1="0" y1="560" x2="1024" y2="560"/>
    <line x1="0" y1="580" x2="1024" y2="580"/>
  </g>
  <!-- здание Главного штаба на заднем плане (слева) -->
  <rect x="0" y="380" width="240" height="120" fill="#A8C18F"/>
  <rect x="0" y="375" width="240" height="10" fill="#7E9B68"/>
  <g fill="#E8E2D0">
    <rect x="20"  y="395" width="10" height="40"/>
    <rect x="40"  y="395" width="10" height="40"/>
    <rect x="60"  y="395" width="10" height="40"/>
    <rect x="80"  y="395" width="10" height="40"/>
    <rect x="100" y="395" width="10" height="40"/>
    <rect x="120" y="395" width="10" height="40"/>
    <rect x="140" y="395" width="10" height="40"/>
    <rect x="160" y="395" width="10" height="40"/>
    <rect x="180" y="395" width="10" height="40"/>
    <rect x="200" y="395" width="10" height="40"/>
    <rect x="220" y="395" width="10" height="40"/>
  </g>
  <!-- Эрмитаж справа (синий силуэт) -->
  <rect x="784" y="380" width="240" height="120" fill="#3E7BB8"/>
  <rect x="784" y="375" width="240" height="10" fill="#E8E2D0"/>
  <g fill="#E8E2D0">
    <rect x="800" y="395" width="10" height="40"/>
    <rect x="820" y="395" width="10" height="40"/>
    <rect x="840" y="395" width="10" height="40"/>
    <rect x="860" y="395" width="10" height="40"/>
    <rect x="880" y="395" width="10" height="40"/>
    <rect x="900" y="395" width="10" height="40"/>
    <rect x="920" y="395" width="10" height="40"/>
    <rect x="940" y="395" width="10" height="40"/>
    <rect x="960" y="395" width="10" height="40"/>
    <rect x="980" y="395" width="10" height="40"/>
    <rect x="1000" y="395" width="10" height="40"/>
  </g>
  <!-- база колонны (квадрат) -->
  <rect x="478" y="470" width="68" height="50" fill="#7A6F58"/>
  <rect x="465" y="510" width="94" height="20" fill="#5A4F38"/>
  <!-- пьедестал с барельефом -->
  <rect x="473" y="380" width="78" height="90" fill="#7A6F58"/>
  <rect x="473" y="380" width="78" height="6" fill="#5A4F38"/>
  <rect x="473" y="465" width="78" height="6" fill="#5A4F38"/>
  <!-- сама колонна (гранитный монолит) -->
  <rect x="496" y="100" width="32" height="280" fill="#8A4842"/>
  <!-- блик на колонне -->
  <rect x="502" y="100" width="4" height="280" fill="#A55C56" opacity="0.6"/>
  <!-- капитель -->
  <rect x="490" y="85" width="44" height="20" fill="#A89C8A"/>
  <rect x="486" y="80" width="52" height="8" fill="#A89C8A"/>
  <!-- ангел с крестом -->
  <circle cx="512" cy="60" r="10" fill="#E2DCC8"/>
  <rect x="510" y="40" width="4" height="22" fill="#E2DCC8"/>
  <!-- крест над ангелом -->
  <rect x="510" y="20" width="4" height="20" fill="#E2DCC8"/>
  <rect x="502" y="28" width="20" height="4" fill="#E2DCC8"/>
  <!-- крылья ангела -->
  <path d="M 502 60 Q 488 50, 484 65 Q 492 62, 502 64 Z" fill="#E2DCC8"/>
  <path d="M 522 60 Q 536 50, 540 65 Q 532 62, 522 64 Z" fill="#E2DCC8"/>
  <!-- название -->
  <text x="512" y="160" font-family="'Geologica',sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#fff">Александровская колонна</text>
  <text x="512" y="195" font-family="'Geologica',sans-serif" font-size="20" text-anchor="middle" fill="#E6EEF5">1834 · Дворцовая площадь</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E5B7B"/>
      <stop offset="100%" stop-color="#8AA1B5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <rect y="540" width="1024" height="60" fill="#4A5A4E"/>
  <!-- основное тело храма -->
  <rect x="340" y="400" width="344" height="140" fill="#D14B3E"/>
  <!-- центральная "луковица" -->
  <ellipse cx="512" cy="340" rx="60" ry="50" fill="#EDC555"/>
  <path d="M 452 340 Q 452 260, 512 240 Q 572 260, 572 340 Z" fill="#EDC555"/>
  <path d="M 470 320 Q 482 280, 512 270 Q 542 280, 554 320" fill="#D4A03B" opacity="0.5"/>
  <rect x="497" y="240" width="30" height="20" fill="#D14B3E"/>
  <!-- крест -->
  <rect x="510" y="180" width="4" height="60" fill="#EDC555"/>
  <rect x="500" y="195" width="24" height="4" fill="#EDC555"/>
  <!-- левая луковица (зелёная) -->
  <ellipse cx="412" cy="380" rx="42" ry="38" fill="#5A8C5C"/>
  <path d="M 370 380 Q 370 320, 412 305 Q 454 320, 454 380 Z" fill="#5A8C5C"/>
  <rect x="402" y="305" width="20" height="14" fill="#D14B3E"/>
  <rect x="410" y="270" width="4" height="35" fill="#5A8C5C"/>
  <!-- правая луковица (голубая) -->
  <ellipse cx="612" cy="380" rx="42" ry="38" fill="#6BA8C7"/>
  <path d="M 570 380 Q 570 320, 612 305 Q 654 320, 654 380 Z" fill="#6BA8C7"/>
  <rect x="602" y="305" width="20" height="14" fill="#D14B3E"/>
  <rect x="610" y="270" width="4" height="35" fill="#6BA8C7"/>
  <!-- ещё две по бокам -->
  <ellipse cx="345" cy="430" rx="28" ry="24" fill="#C8A03A"/>
  <path d="M 317 430 Q 317 390, 345 380 Q 373 390, 373 430 Z" fill="#C8A03A"/>
  <ellipse cx="679" cy="430" rx="28" ry="24" fill="#C8A03A"/>
  <path d="M 651 430 Q 651 390, 679 380 Q 707 390, 707 430 Z" fill="#C8A03A"/>
  <!-- окна и декор фасада -->
  <g fill="#F5E6CC">
    <rect x="370" y="440" width="20" height="50" rx="10"/>
    <rect x="420" y="440" width="20" height="50" rx="10"/>
    <rect x="480" y="440" width="20" height="60" rx="10"/>
    <rect x="524" y="440" width="20" height="60" rx="10"/>
    <rect x="584" y="440" width="20" height="50" rx="10"/>
    <rect x="634" y="440" width="20" height="50" rx="10"/>
  </g>
  <!-- название -->
  <text x="512" y="65" font-family="'Geologica',sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#fff">Храм Спаса на Крови</text>
  <text x="512" y="100" font-family="'Geologica',sans-serif" font-size="20" text-anchor="middle" fill="#E6EEF5">1907 · набережная канала Грибоедова</text>
</svg>
